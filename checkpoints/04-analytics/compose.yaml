name: kickstopper-04-analytics

x-backend: &backend
  image: kickstopper-04-backend:local
  build: ./backend
  init: true
  restart: unless-stopped
  environment: &environment
    DATABASE_URL: postgres://${POSTGRES_USER:-kickstopper}:${POSTGRES_PASSWORD:-kickstopper-local}@postgres:5432/${POSTGRES_DB:-kickstopper}

services:
  frontend:
    image: kickstopper-04-frontend:local
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    <<: *backend
    command: ["sh", "-c", "node src/bootstrap.js && node src/server.js"]
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js", "3001"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s

  postgres:
    image: kickstopper-04-postgres:local
    build: ./database
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_durable,pg_duckdb
      - -c
      - pg_durable.database=${POSTGRES_DB:-kickstopper}
      - -c
      - pg_durable.worker_role=${POSTGRES_USER:-kickstopper}
      - -c
      - pg_durable.host=/var/run/postgresql
      - -c
      - pg_durable.enable_superuser_instances=on
      - -c
      - pg_durable.http_security=disabled
      - -c
      - duckdb.max_memory=256
      - -c
      - duckdb.threads=2
      - -c
      - duckdb.autoinstall_known_extensions=false
      - -c
      - duckdb.autoload_known_extensions=false
      - -c
      - duckdb.enable_external_access=false
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kickstopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kickstopper-local}
      POSTGRES_DB: ${POSTGRES_DB:-kickstopper}
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
