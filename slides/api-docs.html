<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kickstopper API | Swagger UI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  </head>
  <body>
    <header class="api-header">
      <a href="./">Delete your backend.</a>
      <strong>Kickstopper API</strong>
      <label>Checkpoint
        <select id="api-checkpoint">
          <option value="05">05 / Generated API</option>
          <option value="06">06 / React inside Postgres</option>
        </select>
      </label>
      <label>Source
        <select id="api-source">
          <option value="live">Live API</option>
          <option value="snapshot">Captured schema</option>
        </select>
      </label>
      <button id="api-reload">Reload</button>
    </header>
    <main>
      <div class="api-notice">
        <p id="api-status" role="status">Loading the generated API description...</p>
        <p>Generated by PostgREST. Anonymous access; only GET requests can be tried here. Other operations remain visible as documentation, not proof of permission to execute them.</p>
      </div>
      <div id="api-error" role="alert" hidden></div>
      <div id="swagger-ui"></div>
    </main>
    <script type="module" src="./src/api-docs.js"></script>
  </body>
</html>
